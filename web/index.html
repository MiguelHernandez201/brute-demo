<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LaBrute Demo</title>
    <style>
      @font-face {
        font-family: GameFont;
        src:
          url(/fonts/Movavi_Grotesque_Black.woff) format('woff'),
          url(/fonts/Movavi_Grotesque_Black.ttf) format('truetype');
      }
      :root {
        --bg: #1b1410;
        --panel: #2a201a;
        --ink: #f3e6d0;
        --a: #4cc9f0;
        --b: #f72585;
        --gold: #ffd166;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 50% 0, #3a2a1e, var(--bg));
        color: var(--ink);
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
      }
      h1 {
        color: var(--gold);
        letter-spacing: 2px;
        margin: 8px 0 16px;
        text-align: center;
      }
      .panel {
        background: var(--panel);
        border-radius: 12px;
        padding: 16px;
        width: 100%;
        max-width: 860px;
      }
      #setup {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 420px;
      }
      input {
        width: 100%;
        margin-top: 4px;
        padding: 10px;
        border-radius: 8px;
        border: 2px solid #5a4636;
        background: #150f0b;
        color: var(--ink);
        font-size: 16px;
      }
      button {
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: var(--gold);
        color: #2a1a08;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.1);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
        filter: none;
      }
      #arena {
        display: none;
      }
      /* El hueco del lienzo mantiene siempre su tamaño (500x300) para que la página no salte entre peleas */
      #canvas {
        position: relative;
        width: 100%;
        max-width: 800px;
        aspect-ratio: 5/3;
        margin: 0 auto;
        border-radius: 8px;
        overflow: hidden;
        background: #fbf7c0;
      }
      #canvas canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        border-radius: 8px;
      }
      #canvas canvas.live {
        opacity: 0;
      }
      #canvas canvas.live.ready {
        opacity: 1;
      }
      #canvas canvas.snapshot {
        z-index: 1;
        transition: opacity 0.25s;
      }
      #canvas canvas.snapshot.fade {
        opacity: 0;
      }
      #status {
        text-align: center;
        min-height: 24px;
        margin: 8px 0;
        opacity: 0.8;
      }
      /* Pelea a la derecha y lista del royale a su izquierda */
      #arena.panel {
        max-width: 1180px;
      }
      .stage {
        display: grid;
        grid-template-columns: 320px minmax(0, 800px);
        gap: 12px;
        justify-content: center;
        align-items: start;
      }
      .shop {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #150f0b;
        border-radius: 10px;
        padding: 10px;
        border: 2px solid var(--a);
      }
      .shop-name {
        font-weight: 800;
        font-size: 16px;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .shop-label {
        font-size: 12px;
        opacity: 0.7;
      }
      @media (max-width: 1100px) {
        .stage {
          grid-template-columns: 1fr 1fr;
        }
        .stage #canvas {
          grid-column: 1 / -1;
          grid-row: 1;
        }
      }
      /* Battle royale: lista de participantes en lugar de las tiendas */
      #roster {
        display: none;
        border-color: var(--gold);
      }
      /* Zoom dinámico: solo en el royale */
      #zoomToggle {
        display: none;
      }
      #arena.royale #zoomToggle {
        display: flex;
      }
      #arena.royale #roster {
        display: flex;
        grid-column: 1;
        grid-row: 1;
      }
      #arena.royale #canvas {
        grid-column: 2;
        grid-row: 1;
      }
      ol.roster {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      /* Fila de cada brute: nombre, vida y barra a la izquierda y su botón de ultimate a la derecha */
      ol.roster li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 5px 4px 8px;
        border-radius: 6px;
        background: #2a201a;
        /* Color del brute: el mismo que su etiqueta en la arena */
        border-left: 4px solid var(--c, transparent);
        cursor: pointer;
      }
      .roster-main {
        flex: 1;
        min-width: 0;
      }
      /* Resaltar una fila es cosa del ratón (pasar por encima, o fijarla con un clic): en el móvil tocarla no hace
         nada, así no se resalta sin querer al ir a pulsar su ultimate (ver main.js) */
      #roster {
        -webkit-tap-highlight-color: transparent;
      }
      @media (hover: hover) {
        ol.roster li:hover {
          background: #3a2c22;
          box-shadow: inset 0 0 0 1px var(--c, transparent);
        }
      }
      ol.roster li.lit {
        background: #3a2c22;
        box-shadow: inset 0 0 0 1px var(--c, transparent);
      }
      /* Con muchos brutes la lista se desplaza en vez de estirar la página */
      ol.roster {
        max-height: 300px;
        overflow-y: auto;
      }
      .dot {
        display: inline-block;
        flex: 0 0 auto;
        width: 9px;
        height: 9px;
        margin-right: 5px;
        border-radius: 50%;
        box-shadow: 0 0 0 1.5px #000;
      }
      .roster-top .dot {
        margin-right: 0;
        align-self: center;
      }
      .roster-stats {
        display: flex;
        justify-content: space-between;
        gap: 6px;
      }
      .fps-good {
        color: #4ade80;
      }
      .fps-ok {
        color: #facc15;
      }
      .fps-bad {
        color: #ef4444;
      }
      .roster-add {
        display: flex;
        gap: 6px;
      }
      .roster-add button {
        flex: 1;
        padding: 7px 8px;
        font-size: 13px;
      }
      .roster-add button + button {
        flex: 0 0 auto;
      }
      /* "Finalizar" en marcha: cuenta atrás */
      .roster-add button.on {
        background: #f97316;
        font-variant-numeric: tabular-nums;
      }
      .kill-feed {
        list-style: none;
        margin: 0;
        padding: 6px 0 0;
        border-top: 1px solid #3a2c22;
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 11px;
        line-height: 1.3;
      }
      .kill-feed li:first-child {
        color: var(--gold);
      }
      .kill-feed .who {
        font-weight: 700;
      }
      ol.roster li span {
        font-weight: 700;
      }
      ol.roster li small {
        font-size: 11px;
        opacity: 0.75;
      }
      .roster-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 6px;
      }
      .roster-top span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hp-text {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      /* Potenciadores de cada fila del royale: tres botones (+300, +1000, +3000) grandes, para pulsarlos bien también
         con el dedo, cada uno con su color */
      .boosts {
        flex: 0 0 auto;
        display: flex;
        gap: 4px;
      }
      ol.roster .boost {
        --b: #4ade80;
        --glow: rgba(74, 222, 128, 0.5);
        position: relative;
        width: 48px;
        height: 40px;
        padding: 0;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: -0.3px;
        line-height: 1;
        border-radius: 10px;
        background: #3a2c22;
        border: 2px solid var(--b);
        color: var(--b);
        box-shadow: 0 0 8px var(--glow);
        font-variant-numeric: tabular-nums;
        touch-action: manipulation;
      }
      ol.roster .boost.t2 {
        --b: #ffc62e;
        --glow: rgba(255, 198, 46, 0.55);
      }
      ol.roster .boost.t3 {
        --b: #ff6b5e;
        --glow: rgba(255, 107, 94, 0.6);
      }
      ol.roster .boost:active:not(:disabled) {
        transform: scale(0.92);
      }
      /* El toque siempre cae en el botón, aunque su contenido cambie (cuenta atrás) */
      ol.roster .boost > * {
        pointer-events: none;
      }
      /* Lanzado y aún sin verse su poder (… encima del que se pulsó), o con la ronda ya acabada: se apagan */
      ol.roster .boost:disabled {
        opacity: 1;
        border-color: #5a4636;
        box-shadow: none;
      }
      ol.roster .boost:disabled .boost-label {
        opacity: 0.3;
      }
      /* (con los puntos encima, la etiqueta casi no se ve: si no, se mezclaban) */
      ol.roster .boost:disabled .boost-label:has(+ .boost-cd) {
        opacity: 0.12;
      }
      .boost-cd {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        text-shadow:
          0 0 3px #000,
          0 0 3px #000;
      }
      /* En cola: sale en cuanto se pueda (el botón late y lleva un reloj de arena en la esquina) */
      ol.roster .boost.queued {
        animation: boost-queued 1s ease-in-out infinite;
      }
      .boost-badge {
        position: absolute;
        top: -4px;
        right: -4px;
        font-size: 13px;
        font-style: normal;
      }
      @keyframes boost-queued {
        50% {
          box-shadow: 0 0 12px var(--b);
          border-color: #fff3c4;
        }
      }
      /* Victorias de la ronda (rivales eliminados), junto a la vida; salta al sumar una */
      .roster-top .wins {
        color: var(--gold);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .roster-top .wins.pop {
        display: inline-block;
        animation: win-pop 0.6s ease-out;
      }
      @keyframes win-pop {
        40% {
          transform: scale(1.6);
        }
      }
      /* Vida: la barra y, a su derecha, los PV (con los potenciadores llegan a cuatro cifras: arriba, junto al nombre,
         no dejaban sitio para él) */
      .roster-hp {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 3px;
      }
      .roster-bar {
        flex: 1;
        height: 8px;
        background: #000;
        border-radius: 4px;
        overflow: hidden;
      }
      .roster-bar > div {
        height: 100%;
        transition:
          width 0.3s,
          background 0.3s;
      }
      ol.roster li.win {
        background: #4a3820;
        border: 1px solid var(--gold);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0.6;
        font-size: 13px;
      }
      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #5a4636;
      }
      input.range {
        padding: 0;
        border: 0;
        accent-color: var(--gold);
        background: transparent;
      }
      .royale-btn {
        background: linear-gradient(180deg, #ffd166, #f4a93b);
      }
      .trailer-btn {
        background: linear-gradient(180deg, #ff4d4d, #990000);
        color: #fff6d6;
        border: 1px solid #ffd166;
      }
      /* Botones de la arena: solo iconos y en una sola fila (lo que hace cada uno sale al pasar el ratón por encima) */
      .controls {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 12px;
      }
      .controls > * {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        max-width: 56px;
        height: 42px;
        padding: 0;
        font-size: 20px;
        line-height: 1;
        touch-action: manipulation;
      }
      .controls > :active:not(:disabled) {
        transform: scale(0.92);
      }
      #speed {
        font-size: 16px;
      }
      /* Sonido apagado: botón oscuro (la música, además, con la nota tachada) */
      .controls .off {
        background: #150f0b;
        box-shadow: inset 0 0 0 2px #5a4636;
      }
      #music.off::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 3px;
        border-radius: 2px;
        background: #ef4444;
        transform: translate(-50%, -50%) rotate(-45deg);
      }
      /* Cuenta atrás de las rondas continuas, en la esquina del botón de nueva ronda */
      .controls .badge {
        position: absolute;
        top: -6px;
        right: -6px;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border-radius: 9px;
        background: #ef4444;
        color: #fff;
        font-size: 12px;
        line-height: 18px;
      }
      /* Casillas con forma de botón: doradas si están activadas, oscuras si no */
      .icon-toggle {
        display: flex;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .icon-toggle input {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: 0;
        padding: 0;
        opacity: 0;
        pointer-events: none;
      }
      .icon-toggle span {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: #150f0b;
        box-shadow: inset 0 0 0 2px #5a4636;
      }
      .icon-toggle input:checked + span {
        background: var(--gold);
        box-shadow: none;
      }
      .icon-toggle input:focus-visible + span {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .download-btn {
        background: linear-gradient(180deg, #4ade80, #15803d);
        color: #052e16;
      }
      #arena.trailer #roster,
      #arena.trailer #autoToggle {
        display: none;
      }
      #arena.trailer .stage {
        grid-template-columns: 1fr;
      }
      #arena.trailer #canvas {
        grid-column: 1 / -1;
      }
      @media (max-width: 1100px) {
        #arena.royale #roster {
          grid-column: 1 / -1;
          grid-row: 2;
        }
        ol.roster {
          max-height: 380px;
        }
        #arena.royale #canvas {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <h1>⚔️ LA BRUTE · DEMO</h1>

    <div class="panel" id="setup">
      <label for="royaleCount">Battle Royale: <b id="royaleCountValue">6</b> brutes, todos contra todos</label>
      <input type="range" id="royaleCount" min="3" max="20" step="1" value="6" class="range" />
      <button id="royaleGo" class="royale-btn">👑 Battle Royale</button>
      <div class="divider"><span>nuevo</span></div>
      <button id="trailerGo" class="trailer-btn">🎬 Ver / Grabar Video Promocional</button>
    </div>

    <div class="panel" id="arena">
      <div id="status"></div>
      <div class="stage">
        <div class="shop roster-panel" id="roster"></div>
        <div id="canvas"></div>
      </div>
      <div class="controls">
        <button id="pause" title="Pausa" aria-label="Pausa">⏸️</button>
        <button id="speed" title="Velocidad">x1</button>
        <button id="sfx" title="Efectos de sonido" aria-label="Efectos de sonido" aria-pressed="true">🔊</button>
        <button id="music" title="Música" aria-label="Música" aria-pressed="true">🎵</button>
        <button id="again" title="Nueva ronda" aria-label="Nueva ronda">👑</button>
        <label class="icon-toggle" id="autoToggle" title="Rondas continuas: al terminar una ronda empieza otra sola"
          ><input type="checkbox" id="auto" aria-label="Rondas continuas" /><span>🔁</span></label
        >
        <label
          class="icon-toggle"
          id="zoomToggle"
          title="Zoom dinámico: acerca la cámara cuando quedan pocos en pie y la aleja cuando hay muchos"
          ><input type="checkbox" id="zoom" checked aria-label="Zoom dinámico" /><span>🔍</span></label
        >
        <button
          id="downloadPromo"
          class="download-btn"
          title="Descargar el video"
          aria-label="Descargar el video"
          hidden
        >
          ⬇️
        </button>
        <button id="back" title="Volver al menú" aria-label="Volver al menú">🏠</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
