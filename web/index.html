<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LaBrute Demo</title>
    <style>
      @font-face {
        font-family: GameFont;
        src:
          url(/fonts/Movavi_Grotesque_Black.woff) format('woff'),
          url(/fonts/Movavi_Grotesque_Black.ttf) format('truetype');
      }
      :root {
        --bg: #1b1410;
        --panel: #2a201a;
        --ink: #f3e6d0;
        --a: #4cc9f0;
        --b: #f72585;
        --gold: #ffd166;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 50% 0, #3a2a1e, var(--bg));
        color: var(--ink);
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
      }
      h1 {
        color: var(--gold);
        letter-spacing: 2px;
        margin: 8px 0 16px;
        text-align: center;
      }
      .panel {
        background: var(--panel);
        border-radius: 12px;
        padding: 16px;
        width: 100%;
        max-width: 860px;
      }
      #setup {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 420px;
      }
      input {
        width: 100%;
        margin-top: 4px;
        padding: 10px;
        border-radius: 8px;
        border: 2px solid #5a4636;
        background: #150f0b;
        color: var(--ink);
        font-size: 16px;
      }
      button {
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: var(--gold);
        color: #2a1a08;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.1);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
        filter: none;
      }
      #arena {
        display: none;
      }
      /* El hueco del lienzo mantiene siempre su tamaño (500x300) para que la página no salte entre peleas */
      #canvas {
        position: relative;
        width: 100%;
        max-width: 800px;
        aspect-ratio: 5/3;
        margin: 0 auto;
        border-radius: 8px;
        overflow: hidden;
        background: #fbf7c0;
      }
      #canvas canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        border-radius: 8px;
      }
      #canvas canvas.live {
        opacity: 0;
      }
      #canvas canvas.live.ready {
        opacity: 1;
      }
      #canvas canvas.snapshot {
        z-index: 1;
        transition: opacity 0.25s;
      }
      #canvas canvas.snapshot.fade {
        opacity: 0;
      }
      #status {
        text-align: center;
        min-height: 24px;
        margin: 8px 0;
        opacity: 0.8;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
      }
      .toggle input {
        width: 16px;
        height: 16px;
        margin: 0;
        padding: 0;
        accent-color: var(--gold);
        cursor: pointer;
      }
      .auto-toggle {
        flex: 0 0 auto;
        background: #150f0b;
        border-radius: 8px;
        padding: 0 14px;
        font-size: 14px;
        font-weight: 700;
      }
      /* Pelea al centro y tienda de cada jugador a los lados */
      #arena.panel {
        max-width: 1180px;
      }
      .stage {
        display: grid;
        grid-template-columns: 170px minmax(0, 800px) 170px;
        gap: 12px;
        justify-content: center;
        align-items: start;
      }
      .shop {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #150f0b;
        border-radius: 10px;
        padding: 10px;
        border: 2px solid var(--a);
      }
      .shop-name {
        font-weight: 800;
        font-size: 16px;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .shop-label {
        font-size: 12px;
        opacity: 0.7;
      }
      @media (max-width: 1100px) {
        .stage {
          grid-template-columns: 1fr 1fr;
        }
        .stage #canvas {
          grid-column: 1 / -1;
          grid-row: 1;
        }
      }
      /* Battle royale: lista de participantes en lugar de las tiendas */
      #roster {
        display: none;
        border-color: var(--gold);
      }
      /* Zoom dinámico: solo en el royale */
      #zoomToggle {
        display: none;
      }
      #arena.royale #zoomToggle {
        display: flex;
      }
      #arena.royale #roster {
        display: flex;
        grid-column: 1;
        grid-row: 1;
      }
      #arena.royale #canvas {
        grid-column: 2;
        grid-row: 1;
      }
      ol.roster {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      ol.roster li {
        display: flex;
        flex-direction: column;
        padding: 5px 8px;
        border-radius: 6px;
        background: #2a201a;
        /* Color del brute: el mismo que su etiqueta en la arena */
        border-left: 4px solid var(--c, transparent);
        cursor: pointer;
      }
      ol.roster li:hover,
      ol.roster li.lit {
        background: #3a2c22;
        box-shadow: inset 0 0 0 1px var(--c, transparent);
      }
      /* Con muchos brutes la lista se desplaza en vez de estirar la página */
      ol.roster {
        max-height: 250px;
        overflow-y: auto;
      }
      .dot {
        display: inline-block;
        flex: 0 0 auto;
        width: 9px;
        height: 9px;
        margin-right: 5px;
        border-radius: 50%;
        box-shadow: 0 0 0 1.5px #000;
      }
      .roster-top .dot {
        margin-right: 0;
        align-self: center;
      }
      .roster-stats {
        display: flex;
        justify-content: space-between;
        gap: 6px;
      }
      .fps-good {
        color: #4ade80;
      }
      .fps-ok {
        color: #facc15;
      }
      .fps-bad {
        color: #ef4444;
      }
      .roster-add {
        display: flex;
        gap: 6px;
      }
      .roster-add button {
        flex: 1;
        padding: 7px 8px;
        font-size: 13px;
      }
      .roster-add button + button {
        flex: 0 0 auto;
      }
      /* "Finalizar" en marcha: cuenta atrás */
      .roster-add button.on {
        background: #f97316;
        font-variant-numeric: tabular-nums;
      }
      .kill-feed {
        list-style: none;
        margin: 0;
        padding: 6px 0 0;
        border-top: 1px solid #3a2c22;
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 11px;
        line-height: 1.3;
      }
      .kill-feed li:first-child {
        color: var(--gold);
      }
      .kill-feed .who {
        font-weight: 700;
      }
      ol.roster li span {
        font-weight: 700;
      }
      ol.roster li small {
        font-size: 11px;
        opacity: 0.75;
      }
      .roster-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 6px;
      }
      .roster-top span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hp-text {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      /* Botoncito de ultimate de cada fila del royale */
      .roster-top .ult {
        flex: 0 0 auto;
        align-self: center;
        padding: 1px 6px;
        font-size: 12px;
        line-height: 1.4;
        border-radius: 6px;
        background: #3a2c22;
        border: 1px solid var(--gold);
        color: var(--gold);
        box-shadow: 0 0 6px rgba(255, 209, 102, 0.45);
        font-variant-numeric: tabular-nums;
      }
      .roster-top .ult:disabled {
        box-shadow: none;
      }
      /* En cola: sale en cuanto se pueda */
      .roster-top .ult.queued {
        animation: ult-queued 1s ease-in-out infinite;
      }
      @keyframes ult-queued {
        50% {
          box-shadow: 0 0 10px rgba(255, 209, 102, 0.9);
          border-color: #fff3c4;
        }
      }
      /* Victorias de la ronda (rivales eliminados), junto a la vida; salta al sumar una */
      .roster-top .wins {
        color: var(--gold);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .roster-top .wins.pop {
        display: inline-block;
        animation: win-pop 0.6s ease-out;
      }
      @keyframes win-pop {
        40% {
          transform: scale(1.6);
        }
      }
      .roster-bar {
        height: 8px;
        background: #000;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 4px;
      }
      .roster-bar > div {
        height: 100%;
        transition:
          width 0.3s,
          background 0.3s;
      }
      ol.roster li.win {
        background: #4a3820;
        border: 1px solid var(--gold);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0.6;
        font-size: 13px;
      }
      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #5a4636;
      }
      input.range {
        padding: 0;
        border: 0;
        accent-color: var(--gold);
        background: transparent;
      }
      .royale-btn {
        background: linear-gradient(180deg, #ffd166, #f4a93b);
      }
      .trailer-btn {
        background: linear-gradient(180deg, #ff4d4d, #990000);
        color: #fff6d6;
        border: 1px solid #ffd166;
      }
      .download-btn {
        background: linear-gradient(180deg, #4ade80, #15803d);
        color: #052e16;
        display: none;
      }
      #arena.trailer #roster,
      #arena.trailer .auto-toggle {
        display: none;
      }
      #arena.trailer .stage {
        grid-template-columns: 1fr;
      }
      #arena.trailer #canvas {
        grid-column: 1 / -1;
      }
      @media (max-width: 1100px) {
        #arena.royale #roster {
          grid-column: 1 / -1;
          grid-row: 2;
        }
        ol.roster {
          max-height: 380px;
        }
        #arena.royale #canvas {
          grid-column: 1 / -1;
        }
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .row button {
        flex: 1 1 110px;
      }
      /* Casillas: si no caben en la fila pasan a la siguiente en vez de salirse de la pantalla */
      .row .auto-toggle {
        flex: 1 1 auto;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <h1>⚔️ LA BRUTE · DEMO</h1>

    <div class="panel" id="setup">
      <label for="royaleCount">Battle Royale: <b id="royaleCountValue">6</b> brutes, todos contra todos</label>
      <input type="range" id="royaleCount" min="3" max="20" step="1" value="6" class="range" />
      <button id="royaleGo" class="royale-btn">👑 Battle Royale</button>
      <div class="divider"><span>nuevo</span></div>
      <button id="trailerGo" class="trailer-btn">🎬 Ver / Grabar Video Promocional</button>
    </div>

    <div class="panel" id="arena">
      <div id="status"></div>
      <div class="stage">
        <div class="shop roster-panel" id="roster"></div>
        <div id="canvas"></div>
      </div>
      <div class="row">
        <button id="pause">⏸ Pausa</button><button id="speed">Velocidad x1</button><button id="sfx">🔊 Efectos</button
        ><button id="music">🎵 Música</button>
      </div>
      <div class="row">
        <button id="again">👑 Nueva ronda</button>
        <button id="downloadPromo" class="download-btn">⬇ Descargar Video</button>
        <label class="toggle auto-toggle"
          ><input type="checkbox" id="auto" /><span id="autoLabel">Rondas continuas</span></label
        >
        <label
          class="toggle auto-toggle"
          id="zoomToggle"
          title="Acerca la cámara cuando quedan pocos en pie y la aleja cuando hay muchos"
          ><input type="checkbox" id="zoom" checked /><span>🔍 Zoom dinámico</span></label
        >
        <button id="back">Volver al menú</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
