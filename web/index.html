<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LaBrute Demo</title>
    <style>
      @font-face {
        font-family: GameFont;
        src:
          url(/fonts/Movavi_Grotesque_Black.woff) format('woff'),
          url(/fonts/Movavi_Grotesque_Black.ttf) format('truetype');
      }
      @font-face {
        font-family: LaBrute;
        src:
          url(/fonts/labrute.woff) format('woff'),
          url(/fonts/labrute.ttf) format('truetype');
      }
      @font-face {
        font-family: Handwritten;
        src:
          url(/fonts/acmesa.woff) format('woff'),
          url(/fonts/acmesa.ttf) format('truetype');
      }
      :root {
        --bg: #1b1410;
        --panel: #2a201a;
        --ink: #f3e6d0;
        --a: #4cc9f0;
        --b: #f72585;
        --gold: #ffd166;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 50% 0, #3a2a1e, var(--bg));
        color: var(--ink);
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
      }
      h1 {
        color: var(--gold);
        letter-spacing: 2px;
        margin: 8px 0 16px;
        text-align: center;
      }
      .panel {
        background: var(--panel);
        border-radius: 12px;
        padding: 16px;
        width: 100%;
        max-width: 860px;
      }
      #setup {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 420px;
      }
      input {
        width: 100%;
        margin-top: 4px;
        padding: 10px;
        border-radius: 8px;
        border: 2px solid #5a4636;
        background: #150f0b;
        color: var(--ink);
        font-size: 16px;
      }
      button {
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: var(--gold);
        color: #2a1a08;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.1);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
        filter: none;
      }
      #arena {
        display: none;
      }
      /* El hueco del lienzo mantiene siempre su tamaño (500x300) para que la página no salte entre peleas */
      #canvas {
        position: relative;
        width: 100%;
        max-width: 800px;
        aspect-ratio: 5/3;
        margin: 0 auto;
        border-radius: 8px;
        overflow: hidden;
        background: #fbf7c0;
      }
      #canvas canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        border-radius: 8px;
      }
      #canvas canvas.live {
        opacity: 0;
      }
      #canvas canvas.live.ready {
        opacity: 1;
      }
      #canvas canvas.snapshot {
        z-index: 1;
        transition: opacity 0.25s;
      }
      #canvas canvas.snapshot.fade {
        opacity: 0;
      }
      #status {
        text-align: center;
        min-height: 24px;
        margin: 8px 0;
        opacity: 0.8;
      }
      /* Pelea a la derecha y lista del royale a su izquierda */
      #arena.panel {
        max-width: 1180px;
      }
      .stage {
        display: grid;
        grid-template-columns: 320px minmax(0, 800px);
        gap: 12px;
        justify-content: center;
        align-items: start;
      }
      .shop {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #150f0b;
        border-radius: 10px;
        padding: 10px;
        border: 2px solid var(--a);
      }
      .shop-name {
        font-weight: 800;
        font-size: 16px;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .shop-label {
        font-size: 12px;
        opacity: 0.7;
      }
      @media (max-width: 1100px) {
        .stage {
          grid-template-columns: 1fr 1fr;
        }
        .stage #canvas {
          grid-column: 1 / -1;
          grid-row: 1;
        }
      }
      /* Battle royale: lista de participantes en lugar de las tiendas */
      #roster {
        display: none;
        border-color: var(--gold);
      }
      /* Zoom dinámico: solo en el royale */
      #zoomToggle {
        display: none;
      }
      #arena.royale #zoomToggle {
        display: flex;
      }
      #arena.royale #roster {
        display: flex;
        grid-column: 1;
        grid-row: 1;
      }
      #arena.royale #canvas {
        grid-column: 2;
        grid-row: 1;
      }
      ol.roster {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      /* Fila de cada brute: nombre, vida y barra a la izquierda y su botón de ultimate a la derecha */
      ol.roster li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 5px 4px 8px;
        border-radius: 6px;
        background: #2a201a;
        /* Color del brute: el mismo que su etiqueta en la arena */
        border-left: 4px solid var(--c, transparent);
        cursor: pointer;
      }
      .roster-main {
        flex: 1;
        min-width: 0;
      }
      /* Resaltar una fila es cosa del ratón (pasar por encima, o fijarla con un clic): en el móvil tocarla no hace
         nada, así no se resalta sin querer al ir a pulsar su ultimate (ver main.js) */
      #roster {
        -webkit-tap-highlight-color: transparent;
      }
      @media (hover: hover) {
        ol.roster li:hover {
          background: #3a2c22;
          box-shadow: inset 0 0 0 1px var(--c, transparent);
        }
      }
      ol.roster li.lit {
        background: #3a2c22;
        box-shadow: inset 0 0 0 1px var(--c, transparent);
      }
      /* Con muchos brutes la lista se desplaza en vez de estirar la página */
      ol.roster {
        max-height: 300px;
        overflow-y: auto;
      }
      .dot {
        display: inline-block;
        flex: 0 0 auto;
        width: 9px;
        height: 9px;
        margin-right: 5px;
        border-radius: 50%;
        box-shadow: 0 0 0 1.5px #000;
      }
      .roster-top .dot {
        margin-right: 0;
        align-self: center;
      }
      .roster-stats {
        display: flex;
        justify-content: space-between;
        gap: 6px;
      }
      .fps-good {
        color: #4ade80;
      }
      .fps-ok {
        color: #facc15;
      }
      .fps-bad {
        color: #ef4444;
      }
      .roster-add {
        display: flex;
        gap: 6px;
      }
      .roster-add button {
        flex: 1;
        padding: 7px 8px;
        font-size: 13px;
      }
      .roster-add button + button {
        flex: 0 0 auto;
      }
      /* Agregar un brute que entra con un potenciador: los colores de sus botones en la lista */
      .roster-add.gift-add {
        align-items: center;
      }
      .roster-add.gift-add span {
        font-size: 12px;
        color: #c9b6a4;
        white-space: nowrap;
      }
      .roster-add.gift-add button {
        --b: #4ade80;
        flex: 1 1 0;
        padding: 6px 4px;
        background: #3a2c22;
        border: 2px solid var(--b);
        color: var(--b);
        font-weight: 800;
      }
      .roster-add.gift-add button.t2 {
        --b: #ffc62e;
      }
      .roster-add.gift-add button.t3 {
        --b: #ff6b5e;
      }
      /* "Finalizar" en marcha: cuenta atrás */
      .roster-add button.on {
        background: #f97316;
        font-variant-numeric: tabular-nums;
      }
      .kill-feed {
        list-style: none;
        margin: 0;
        padding: 6px 0 0;
        border-top: 1px solid #3a2c22;
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 11px;
        line-height: 1.3;
      }
      .kill-feed li:first-child {
        color: var(--gold);
      }
      .kill-feed .who {
        font-weight: 700;
      }
      ol.roster li span {
        font-weight: 700;
      }
      ol.roster li small {
        font-size: 11px;
        opacity: 0.75;
      }
      .roster-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 6px;
      }
      .roster-top span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hp-text {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      /* Potenciadores de cada fila del royale: tres botones (+30, +1000, +3000) grandes, para pulsarlos bien también
         con el dedo, cada uno con su color */
      .boosts {
        flex: 0 0 auto;
        display: flex;
        gap: 4px;
      }
      ol.roster .boost {
        --b: #4ade80;
        --glow: rgba(74, 222, 128, 0.5);
        position: relative;
        width: 48px;
        height: 40px;
        padding: 0;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: -0.3px;
        line-height: 1;
        border-radius: 10px;
        background: #3a2c22;
        border: 2px solid var(--b);
        color: var(--b);
        box-shadow: 0 0 8px var(--glow);
        font-variant-numeric: tabular-nums;
        touch-action: manipulation;
      }
      ol.roster .boost.t2 {
        --b: #ffc62e;
        --glow: rgba(255, 198, 46, 0.55);
      }
      ol.roster .boost.t3 {
        --b: #ff6b5e;
        --glow: rgba(255, 107, 94, 0.6);
      }
      ol.roster .boost:active:not(:disabled) {
        transform: scale(0.92);
      }
      /* El toque siempre cae en el botón, aunque su contenido cambie (cuenta atrás) */
      ol.roster .boost > * {
        pointer-events: none;
      }
      /* Lanzado y aún sin verse su poder (… encima del que se pulsó), o con la ronda ya acabada: se apagan */
      ol.roster .boost:disabled {
        opacity: 1;
        border-color: #5a4636;
        box-shadow: none;
      }
      ol.roster .boost:disabled .boost-label {
        opacity: 0.3;
      }
      /* (con los puntos encima, la etiqueta casi no se ve: si no, se mezclaban) */
      ol.roster .boost:disabled .boost-label:has(+ .boost-cd) {
        opacity: 0.12;
      }
      .boost-cd {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        text-shadow:
          0 0 3px #000,
          0 0 3px #000;
      }
      /* En cola: sale en cuanto se pueda (el botón late y lleva un reloj de arena en la esquina) */
      ol.roster .boost.queued {
        animation: boost-queued 1s ease-in-out infinite;
      }
      .boost-badge {
        position: absolute;
        top: -4px;
        right: -4px;
        font-size: 13px;
        font-style: normal;
      }
      @keyframes boost-queued {
        50% {
          box-shadow: 0 0 12px var(--b);
          border-color: #fff3c4;
        }
      }
      /* Victorias de la ronda (rivales eliminados), junto a la vida; salta al sumar una */
      .roster-top .wins {
        color: var(--gold);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .roster-top .wins.pop {
        display: inline-block;
        animation: win-pop 0.6s ease-out;
      }
      @keyframes win-pop {
        40% {
          transform: scale(1.6);
        }
      }
      /* Vida: la barra y, a su derecha, los PV (con los potenciadores llegan a cuatro cifras: arriba, junto al nombre,
         no dejaban sitio para él) */
      .roster-hp {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 3px;
      }
      .roster-bar {
        flex: 1;
        height: 8px;
        background: #000;
        border-radius: 4px;
        overflow: hidden;
      }
      .roster-bar > div {
        height: 100%;
        transition:
          width 0.3s,
          background 0.3s;
      }
      ol.roster li.win {
        background: #4a3820;
        border: 1px solid var(--gold);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0.6;
        font-size: 13px;
      }
      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #5a4636;
      }
      input.range {
        padding: 0;
        border: 0;
        accent-color: var(--gold);
        background: transparent;
      }
      .trailer-btn {
        background: linear-gradient(180deg, #ff4d4d, #990000);
        color: #fff6d6;
        border: 1px solid #ffd166;
      }
      /* Botones de la arena: solo iconos y en una sola fila (lo que hace cada uno sale al pasar el ratón por encima) */
      .controls {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 12px;
      }
      .controls > * {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        max-width: 56px;
        height: 42px;
        padding: 0;
        font-size: 20px;
        line-height: 1;
        touch-action: manipulation;
      }
      .controls > :active:not(:disabled) {
        transform: scale(0.92);
      }
      #speed {
        font-size: 16px;
      }
      /* Sonido apagado: botón oscuro (la música, además, con la nota tachada) */
      .controls .off {
        background: #150f0b;
        box-shadow: inset 0 0 0 2px #5a4636;
      }
      #music.off::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 3px;
        border-radius: 2px;
        background: #ef4444;
        transform: translate(-50%, -50%) rotate(-45deg);
      }
      /* Cuenta atrás de las rondas continuas, en la esquina del botón de nueva ronda */
      .controls .badge {
        position: absolute;
        top: -6px;
        right: -6px;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border-radius: 9px;
        background: #ef4444;
        color: #fff;
        font-size: 12px;
        line-height: 18px;
      }
      /* Casillas con forma de botón: doradas si están activadas, oscuras si no */
      .icon-toggle {
        display: flex;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .icon-toggle input {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: 0;
        padding: 0;
        opacity: 0;
        pointer-events: none;
      }
      .icon-toggle span {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: #150f0b;
        box-shadow: inset 0 0 0 2px #5a4636;
      }
      .icon-toggle input:checked + span {
        background: var(--gold);
        box-shadow: none;
      }
      .icon-toggle input:focus-visible + span {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .download-btn {
        background: linear-gradient(180deg, #4ade80, #15803d);
        color: #052e16;
      }
      #arena.trailer #roster,
      #arena.trailer #autoToggle {
        display: none;
      }
      #arena.trailer .stage {
        grid-template-columns: 1fr;
      }
      #arena.trailer #canvas {
        grid-column: 1 / -1;
      }
      @media (max-width: 1100px) {
        #arena.royale #roster {
          grid-column: 1 / -1;
          grid-row: 2;
        }
        ol.roster {
          max-height: 380px;
        }
        #arena.royale #canvas {
          grid-column: 1 / -1;
        }
      }

      /* ===== Modo TikTok: pantalla vertical 9:16 para transmitir (ver main.js). Todo se mide en cqw (centésimas del
         ancho de la pantalla vertical), así se ve igual en una ventana pequeña que a pantalla completa ===== */
      .tiktok-btn {
        background: linear-gradient(180deg, #25f4ee, #fe2c55);
        color: #fff;
        text-shadow: 0 1px 2px #000;
      }
      #ttHeader,
      #ttRanking,
      #ttWinner,
      #ttReset {
        display: none;
      }
      body.tiktok {
        padding: 0;
        height: 100vh;
        overflow: hidden;
        justify-content: center;
        background: #000;
      }
      body.tiktok h1,
      body.tiktok #status {
        display: none;
      }
      body.tiktok #arena {
        position: relative;
        container-type: inline-size;
        width: min(100vw, 56.25vh);
        height: min(100vh, 177.78vw);
        max-width: none;
        padding: 0;
        border-radius: 0;
        flex-direction: column;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 35%, transparent 40%, rgba(0, 0, 0, 0.55) 100%),
          repeating-linear-gradient(0deg, transparent 0 11cqw, rgba(255, 214, 120, 0.05) 11cqw 11.4cqw),
          repeating-linear-gradient(90deg, transparent 0 14cqw, rgba(255, 214, 120, 0.05) 14cqw 14.4cqw),
          linear-gradient(180deg, #2f2a14, #1d190c);
      }
      body.tiktok #ttHeader {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 4cqw 4cqw 2cqw;
        font-family: GameFont, system-ui, sans-serif;
        font-size: 5cqw;
        color: var(--gold);
        text-shadow: 0 0.5cqw 0 #000;
      }
      body.tiktok #ttRound {
        font-size: 4cqw;
        color: var(--ink);
      }
      /* La lista y el ranking quedan justo debajo de la arena; lo que sobra, abajo, donde TikTok pone los comentarios */
      body.tiktok .stage {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2cqw;
        flex: 0 1 auto;
        min-height: 0;
      }
      body.tiktok #canvas {
        flex: 0 0 auto;
        max-width: none;
        border-radius: 0;
      }
      body.tiktok #canvas canvas {
        border-radius: 0;
      }
      body.tiktok #arena.royale #roster {
        order: 2;
        flex: 0 1 auto;
        min-height: 0;
        gap: 1.5cqw;
        padding: 0 3cqw;
        border: 0;
        background: transparent;
        overflow: hidden;
      }
      body.tiktok #roster .shop-name,
      body.tiktok #rosterFps,
      body.tiktok #roster .roster-add,
      body.tiktok ol.roster .boosts {
        display: none;
      }
      body.tiktok .roster-stats {
        justify-content: center;
        font-family: GameFont, system-ui, sans-serif;
        font-size: 4.2cqw;
        opacity: 1;
        color: var(--gold);
      }
      body.tiktok ol.roster {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5cqw;
        max-height: none;
        overflow: hidden;
      }
      body.tiktok ol.roster li {
        gap: 1cqw;
        padding: 1.2cqw 2cqw;
        border-left-width: 1.2cqw;
        border-radius: 1.5cqw;
      }
      body.tiktok ol.roster li span,
      body.tiktok .roster-top .wins {
        font-size: 3.6cqw;
      }
      body.tiktok ol.roster li small {
        font-size: 2.8cqw;
      }
      body.tiktok .roster-bar {
        height: 1.8cqw;
        border-radius: 1cqw;
      }
      body.tiktok .dot {
        width: 2.4cqw;
        height: 2.4cqw;
      }
      body.tiktok .kill-feed {
        gap: 1cqw;
        padding-top: 1.5cqw;
        font-size: 3.4cqw;
      }
      body.tiktok #ttRanking {
        display: block;
        padding: 2cqw 4cqw 4cqw;
        font-size: 3.6cqw;
      }
      #ttRanking .tt-title {
        font-family: GameFont, system-ui, sans-serif;
        font-size: 4.4cqw;
        color: var(--gold);
        margin-bottom: 1cqw;
      }
      #ttRanking ol {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.8cqw;
      }
      #ttRanking li {
        display: flex;
        justify-content: space-between;
        gap: 2cqw;
      }
      #ttRanking li span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #ttRanking li b {
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      #ttRanking p {
        margin: 0;
        opacity: 0.7;
      }
      /* Ganador de la ronda, en grande, mientras cuenta para la siguiente */
      body.tiktok #ttWinner.show {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2cqw;
        text-align: center;
        background: rgba(0, 0, 0, 0.6);
        font-family: GameFont, system-ui, sans-serif;
        animation: tt-pop 0.5s ease-out;
      }
      #ttWinner .tt-crown {
        font-size: 22cqw;
      }
      #ttWinner .tt-name {
        max-width: 92cqw;
        font-size: 11cqw;
        color: var(--gold);
        text-shadow: 0 1cqw 0 #000;
        overflow-wrap: anywhere;
      }
      #ttWinner .tt-sub {
        font-size: 6cqw;
        text-transform: uppercase;
      }
      #ttWinner .tt-next {
        margin-top: 4cqw;
        font-family: system-ui, sans-serif;
        font-size: 4cqw;
        opacity: 0.8;
      }
      @keyframes tt-pop {
        from {
          transform: scale(1.3);
          opacity: 0;
        }
      }
      /* Botones: ocultos (no salen en el directo); la tecla C los muestra encima, con los de cada brute */
      body.tiktok .controls {
        display: none;
      }
      body.tiktok.tt-controls .controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        display: flex;
        margin: 0;
        padding: 2cqw;
        background: rgba(0, 0, 0, 0.8);
      }
      body.tiktok.tt-controls #ttReset {
        display: block;
      }
      body.tiktok.tt-controls #roster .roster-add,
      body.tiktok.tt-controls ol.roster .boosts {
        display: flex;
      }
      /* (con los botones de cada brute, una sola columna que se desplaza) */
      body.tiktok.tt-controls ol.roster {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }
      body.tiktok.tt-controls ol.roster .boost {
        width: 14cqw;
        height: 9cqw;
        font-size: 3.4cqw;
      }

      /* ===== Panel de regalos (simulador del directo, ver main.js): flotante abajo a la derecha; con ?panel, la
         página entera ===== */
      #giftPanel {
        display: none;
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 20;
        width: 340px;
        max-width: calc(100vw - 32px);
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border-radius: 12px;
        border: 2px solid #fe2c55;
        background: #150f0b;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      }
      body.gifts-open #giftPanel {
        display: flex;
      }
      #giftPanel > * {
        flex-shrink: 0;
      }
      .gift-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .gift-head b {
        font-size: 17px;
      }
      .gift-head span {
        flex: 1;
        font-size: 12px;
        opacity: 0.6;
      }
      .gift-head button {
        padding: 4px 9px;
        font-size: 14px;
        background: #3a2c22;
        color: var(--ink);
      }
      /* Cómo va la conexión con el directo de verdad (ver connectLive en main.js) */
      .gift-live {
        padding: 6px 9px;
        border-radius: 8px;
        border: 1px solid #4a3a2e;
        background: #1f1712;
        font-size: 12px;
        line-height: 1.35;
      }
      .gift-live[data-state='conectado'] {
        border-color: #22c55e;
      }
      #giftPanel label {
        font-size: 12px;
        opacity: 0.7;
      }
      .gift-user {
        display: flex;
        gap: 6px;
      }
      .gift-user input {
        margin: 0;
        padding: 8px;
      }
      .gift-user button {
        padding: 6px 10px;
      }
      .gift-count {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
      }
      .gift-count span {
        flex: 1;
        opacity: 0.7;
      }
      .gift-count button {
        padding: 5px 12px;
        font-size: 13px;
        background: #3a2c22;
        color: var(--ink);
      }
      .gift-count button.on {
        background: var(--gold);
        color: #2a1a08;
      }
      .gift-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
      .gift-grid .gift {
        --b: #4ade80;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        padding: 6px 2px;
        background: #2a201a;
        border: 2px solid var(--b);
        color: var(--ink);
        font-size: 12px;
        touch-action: manipulation;
      }
      .gift-grid .gift.t2 {
        --b: #ffc62e;
      }
      .gift-grid .gift.t3 {
        --b: #ff6b5e;
      }
      .gift-grid .gift.t4 {
        --b: #c084fc;
      }
      .gift-grid .gift.t5 {
        --b: #2dd4bf;
      }
      .gift-grid .gift.t6 {
        --b: #f472b6;
      }
      .gift-grid .gift:active {
        transform: scale(0.94);
      }
      .gift-grid .gift i {
        font-style: normal;
        font-size: 26px;
      }
      .gift-grid .gift small {
        opacity: 0.6;
        font-weight: 400;
      }
      .gift-grid .gift b {
        color: var(--b);
      }
      .gift-actions {
        display: flex;
        gap: 6px;
      }
      .gift-actions button {
        flex: 1;
        padding: 9px 6px;
        font-size: 14px;
      }
      #giftPopup {
        background: #3a2c22;
        color: var(--ink);
      }
      /* ?panel: solo el panel, en su propia ventana */
      body.panel-only > :not(#giftPanel):not(script) {
        display: none !important;
      }
      body.panel-only #giftPanel {
        position: static;
        max-height: none;
        width: 100%;
        max-width: 420px;
        box-shadow: none;
      }
      body.panel-only #giftClose,
      body.panel-only #giftPopup {
        display: none;
      }
      /* Avisos de regalos, arriba a la izquierda de la arena */
      #giftToasts {
        position: absolute;
        left: 1.5%;
        top: 13%;
        z-index: 3;
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 70%;
        pointer-events: none;
      }
      .gift-toast {
        --b: #4ade80;
        padding: 4px 9px;
        border-radius: 999px;
        background: rgba(20, 12, 8, 0.82);
        border: 2px solid var(--b);
        color: #fff;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        animation: toast-in 0.35s ease-out;
        transition: opacity 0.4s;
      }
      .gift-toast.t2 {
        --b: #ffc62e;
      }
      .gift-toast.t3 {
        --b: #ff6b5e;
      }
      .gift-toast.t0 {
        --b: #4cc9f0;
      }
      .gift-toast.t4 {
        --b: #c084fc;
      }
      .gift-toast.t5 {
        --b: #2dd4bf;
      }
      .gift-toast.t6 {
        --b: #f472b6;
      }
      .gift-toast span {
        color: var(--b);
        font-weight: 800;
      }
      .gift-toast.out {
        opacity: 0;
      }
      @keyframes toast-in {
        from {
          transform: translateX(-30%);
          opacity: 0;
        }
      }
      body.tiktok .gift-toast {
        padding: 0.8cqw 2cqw;
        font-size: 3.4cqw;
      }
      /* Regalos de un combo que aún no han salido, en la fila de la lista */
      .roster-top .gifts {
        color: #fe7a95;
        font-size: 12px;
        white-space: nowrap;
      }
      body.tiktok .roster-top .gifts {
        font-size: 3.4cqw;
      }

      /* ===== Modo TikTok, distribución tipo directo: la lista de brutes va encima de la arena (columna a la izquierda),
         los avisos de regalos a la derecha ===== */
      body.tiktok .stage {
        position: relative;
        gap: 1.5cqw;
      }
      body.tiktok #canvas {
        order: 0;
      }
      body.tiktok #arena.royale #roster {
        display: contents;
      }
      body.tiktok .roster-stats {
        order: 1;
        padding: 0 3cqw;
        font-size: 3.8cqw;
      }
      body.tiktok .kill-feed {
        order: 2;
        padding: 0 3cqw;
        font-size: 3cqw;
      }
      body.tiktok:not(.tt-controls) ol.roster {
        display: none;
        position: absolute;
        z-index: 4;
        top: 1cqw;
        left: 1cqw;
        width: 27cqw;
        max-height: 58cqw;
        flex-direction: column;
        gap: 0.8cqw;
        pointer-events: none;
      }
      body.tiktok:not(.tt-controls) ol.roster li {
        padding: 0.4cqw 1.2cqw;
        border-left-width: 0.8cqw;
        border-radius: 1cqw;
        background: rgba(15, 10, 6, 0.55);
      }
      body.tiktok:not(.tt-controls) ol.roster li span,
      body.tiktok:not(.tt-controls) .roster-top .wins {
        font-size: 2.8cqw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      body.tiktok:not(.tt-controls) ol.roster li small {
        display: none;
      }
      body.tiktok:not(.tt-controls) .roster-bar {
        height: 1.4cqw;
      }
      body.tiktok #giftToasts {
        left: auto;
        right: 1.5%;
        top: 4%;
        align-items: flex-end;
        max-width: 62%;
      }
      body.tiktok #ttRanking {
        padding: 1cqw 3cqw;
        font-size: 3cqw;
      }
      body.tiktok #ttRanking .tt-title {
        font-size: 3.6cqw;
      }

      /* ===== Estilo LaBrute (pergamino crema sobre fondo naranja, bordes marrones) para el modo TikTok ===== */
      body.tiktok {
        --tt-orange: #eda96a;
        --tt-cream: #fbf7c0;
        --tt-line: #7a4a1e;
        --tt-ink: #5b3516;
      }
      body.tiktok #arena {
        background:
          radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(120, 60, 10, 0.25) 100%), var(--tt-orange);
      }
      body.tiktok #ttHeader {
        margin: 2.5cqw 3cqw 1.5cqw;
        padding: 1.6cqw 3.5cqw;
        align-items: center;
        color: var(--tt-ink);
        text-shadow: none;
        background: var(--tt-cream);
        border: 0.7cqw solid var(--tt-line);
        border-radius: 3cqw;
        box-shadow: 0 0.6cqw 0 rgba(122, 74, 30, 0.45);
      }
      body.tiktok #ttRound {
        color: var(--tt-ink);
      }
      body.tiktok #canvas {
        border-top: 0.7cqw solid var(--tt-line);
        border-bottom: 0.7cqw solid var(--tt-line);
      }
      body.tiktok .roster-stats {
        color: var(--tt-ink);
      }
      body.tiktok .kill-feed {
        color: var(--tt-ink);
      }
      body.tiktok #ttRanking {
        margin: 0 3cqw;
        width: fit-content;
        min-width: 56cqw;
        max-width: 94cqw;
        padding: 1.4cqw 3cqw;
        color: var(--tt-ink);
        background: var(--tt-cream);
        border: 0.6cqw solid var(--tt-line);
        border-radius: 2.5cqw;
      }
      body.tiktok #ttRanking .tt-title {
        color: var(--tt-ink);
      }

      /* Cabecera: la imagen del juego (El Bruto) con el número de ronda encima */
      body.tiktok #ttHeader {
        position: relative;
        margin: 1.5cqw 2cqw 1cqw;
        padding: 0;
        aspect-ratio: 930 / 150;
        background: url(/images/header.webp) center / 100% 100% no-repeat;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      body.tiktok #ttHeader > span:first-child {
        display: none;
      }
      body.tiktok #ttRound {
        position: absolute;
        right: 3cqw;
        bottom: 1.5cqw;
        padding: 0.4cqw 2.6cqw;
        font-size: 3.6cqw;
        color: var(--tt-cream);
        background: var(--tt-line);
        border-radius: 99px;
      }
      body.tiktok #ttRound,
      body.tiktok #ttRound:empty {
        display: none;
      }

      /* Cuadro del chat: marco de pergamino abajo a la izquierda, donde TikTok muestra los comentarios */
      #ttChat {
        display: none;
      }
      /* Mismo estilo que el MuiPaper "mybrute" de LaBrute: papel #fbf2af, esquinas de 5px y borde de cuatro capas
         (interior #dec37f, relleno #f6ee90, contorno #725254 y sombra #bc7b4a), en cqw */
      body.tiktok:not(.tt-controls) #ttChat {
        position: absolute;
        left: 3.5cqw;
        bottom: 3.5cqw;
        z-index: 1;
        display: block;
        width: 55cqw;
        height: 60cqw;
        background: #fbf2af;
        border-radius: 1cqw;
        box-shadow:
          0 0 0 0.2cqw #dec37f,
          0 0 0.2cqw 0.8cqw #f6ee90,
          0 0 0 1.1cqw #725254,
          0.55cqw 0.55cqw 0 1.1cqw #bc7b4a;
        pointer-events: none;
      }

      /* Modo TikTok: sin el registro de eliminaciones (solo con el panel de administración, tecla C) */
      body.tiktok:not(.tt-controls) .kill-feed {
        display: none;
      }

      body.tiktok #ttRanking {
        margin-left: auto;
      }

      /* ===== Todo en cajas "El Bruto" (el MuiPaper "mybrute": papel #fbf2af, borde de cuatro capas), en cqw ===== */
      body.tiktok {
        --paper: #fbf2af;
        --box:
          0 0 0 0.15cqw #dec37f, 0 0 0.15cqw 0.5cqw #f6ee90, 0 0 0 0.75cqw #725254, 0.4cqw 0.4cqw 0 0.75cqw #bc7b4a;
      }
      body.tiktok .roster-stats {
        align-self: flex-start;
        margin: 1.2cqw 0 0.6cqw 3.5cqw;
        padding: 0.6cqw 2.4cqw;
        background: var(--paper);
        border-radius: 1cqw;
        box-shadow: var(--box);
        font-size: 3.2cqw;
      }
      body.tiktok #ttRanking {
        margin: 0.6cqw 3.5cqw 0 auto;
        min-width: 50cqw;
        padding: 1cqw 2.6cqw;
        background: var(--paper);
        border: 0;
        border-radius: 1cqw;
        box-shadow: var(--box);
        font-size: 2.8cqw;
      }
      body.tiktok #ttRanking .tt-title {
        font-size: 3.4cqw;
        margin-bottom: 0.4cqw;
      }
      body.tiktok #ttRanking ol {
        gap: 0.2cqw;
      }
      body.tiktok:not(.tt-controls) #ttChat {
        left: 3.5cqw;
        bottom: 3.5cqw;
        width: 53cqw;
        height: 44cqw;
        box-shadow: var(--box);
      }
      #ttChat span {
        display: block;
        padding: 1cqw 2cqw;
        font-family: LaBrute, GameFont, system-ui, sans-serif;
        font-size: 4.6cqw;
        color: #b06b4f;
        text-align: center;
      }

      /* Modo edición (tecla E): los paneles se pueden mover y cambiar de tamaño (ver ttLayout.js) */
      body.tiktok #ttRanking {
        position: relative;
      }
      body.tt-edit #ttHeader,
      body.tt-edit #ttChat,
      body.tt-edit #ttRanking {
        z-index: 15;
        outline: 0.5cqw dashed #fe2c55;
        outline-offset: 1.4cqw;
        cursor: move;
        pointer-events: auto !important;
        touch-action: none;
        user-select: none;
      }
      body.tiktok #ttHeader {
        z-index: 3;
      }
      body.tt-edit #ttHeader::after,
      body.tt-edit #ttChat::after,
      body.tt-edit #ttRanking::after {
        content: '';
        position: absolute;
        right: -1.4cqw;
        bottom: -1.4cqw;
        width: 5cqw;
        height: 5cqw;
        background: #fe2c55;
        border-radius: 1cqw;
        cursor: nwse-resize;
      }
      body.tt-edit #arena::after {
        content: 'Edición: arrastra un panel para moverlo y su esquina rosa para cambiar el tamaño · + adelante · − atrás · E salir · R restablecer';
        position: absolute;
        top: 1cqw;
        left: 50%;
        z-index: 30;
        width: 92cqw;
        transform: translateX(-50%);
        padding: 1cqw 2cqw;
        border-radius: 1cqw;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        font-size: 2.8cqw;
        text-align: center;
        pointer-events: none;
      }

      /* Ranking con las tipografías del juego: título en LaBrute y filas en Handwritten (la de los textos de LaBrute) */
      body.tiktok #ttRanking {
        font-family: Handwritten, system-ui, sans-serif;
        font-size: 3.1cqw;
        color: #b06b4f;
      }
      body.tiktok #ttRanking .tt-title {
        font-family: LaBrute, GameFont, system-ui, sans-serif;
        font-size: 4cqw;
        letter-spacing: 0.2cqw;
        color: #733d2c;
        margin-bottom: 0.6cqw;
      }
      body.tiktok #ttRanking li b {
        font-family: Handwritten, system-ui, sans-serif;
        font-weight: normal;
        color: #733d2c;
      }
      body.tiktok #ttRanking p {
        opacity: 1;
      }

      /* Modo TikTok: sin el contador de brutes en pie (solo con el panel de administración, tecla C) */
      body.tiktok:not(.tt-controls) .roster-stats {
        display: none;
      }

      /* Imagen decorativa colocable (mover y cambiar tamaño con la tecla E, ver ttLayout.js) */
      #ttMascot,
      #ttMascot2 {
        display: none;
      }
      body.tiktok #ttMascot,
      body.tiktok #ttMascot2 {
        position: absolute;
        left: 2cqw;
        bottom: 49cqw;
        z-index: 2;
        display: block;
        width: 26cqw;
        pointer-events: none;
      }
      #ttMascot img,
      #ttMascot2 img {
        display: block;
        width: 100%;
        height: auto;
      }
      body.tt-edit #ttMascot,
      body.tt-edit #ttMascot2 {
        z-index: 15;
        outline: 0.5cqw dashed #fe2c55;
        outline-offset: 0.6cqw;
        cursor: move;
        pointer-events: auto !important;
        touch-action: none;
        user-select: none;
      }
      body.tt-edit #ttMascot::after,
      body.tt-edit #ttMascot2::after {
        content: '';
        position: absolute;
        right: -0.6cqw;
        bottom: -0.6cqw;
        width: 5cqw;
        height: 5cqw;
        background: #fe2c55;
        border-radius: 1cqw;
        cursor: nwse-resize;
      }

      body.tiktok #ttMascot2 {
        left: auto;
        right: 2cqw;
      }

      /* Panel seleccionado en la edición (el que se mueve de capa con + y −) */
      body.tt-edit .tt-sel {
        outline-style: solid !important;
      }

      /* La arena de pelea también se edita: su borde y su esquina van por dentro (tiene overflow oculto) */
      body.tt-edit #canvas {
        outline: 0.5cqw dashed #fe2c55;
        outline-offset: -0.5cqw;
        cursor: move;
        user-select: none;
        touch-action: none;
      }
      body.tt-edit #canvas > canvas {
        pointer-events: none;
      }
      body.tt-edit #canvas::after {
        content: '';
        position: absolute;
        right: 0;
        bottom: 0;
        z-index: 5;
        width: 5cqw;
        height: 5cqw;
        background: #fe2c55;
        border-radius: 1cqw 0 0 0;
        cursor: nwse-resize;
      }

      /* Ronda y reloj en el panel de administración (tecla G) */
      .gift-round {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #4a3a2e;
      }
      .gift-round-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .gift-round-row button {
        flex: 1;
        padding: 8px 6px;
        font-size: 14px;
      }
      .gift-check input {
        flex: none;
        width: auto;
        margin: 0;
      }
      .gift-check {
        flex: 1;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 14px;
      }
      .tt-timer {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .tt-timer input {
        width: 3.2em;
        padding: 4px;
        border-radius: 6px;
        border: 1px solid #888;
        background: #222;
        color: #fff;
        text-align: center;
      }

      /* Modo TikTok: sin los avisos de "X se unió" / "X envió un regalo" sobre la arena */
      body.tiktok #giftToasts {
        display: none;
      }

      .gift-round-row input[type='range'] {
        flex: 1.4;
        width: auto;
        accent-color: #ffd166;
      }
      .gift-round-row button.off {
        opacity: 0.5;
      }
      #giftTrack,
      #giftBg {
        padding: 7px 4px;
        border-radius: 6px;
        border: 1px solid #888;
        background: #222;
        color: #fff;
      }
      #giftBg {
        flex: 1;
        padding: 8px;
      }
      .gift-fps-row {
        justify-content: space-between;
        font-size: 14px;
      }
      #giftFps {
        font-variant-numeric: tabular-nums;
      }
      #giftFps.fps-good {
        color: #4ade80;
      }
      #giftFps.fps-ok {
        color: #facc15;
      }
      #giftFps.fps-bad {
        color: #ef4444;
      }

      .gift-img {
        display: inline-block;
        width: 1em;
        height: 1em;
        object-fit: contain;
        vertical-align: -0.15em;
      }
      /* La minigun es un dibujo en diagonal: a 1em se ve más pequeña que los emojis de al lado */
      .gift-img.minigun-img {
        width: 1.3em;
        height: 1.3em;
        vertical-align: -0.3em;
      }
      #giftSearch {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #888;
        background: #222;
        color: #fff;
      }
      .gift-all {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
        max-height: 190px;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      .gift-all p {
        grid-column: 1 / -1;
        margin: 4px;
        opacity: 0.7;
      }
      .gift-all button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        padding: 4px 2px;
        background: #2a201a;
        color: var(--ink);
        border: 1px solid #4a3a2e;
        border-radius: 8px;
        font-size: 10px;
        line-height: 1.1;
      }
      .gift-all button.t2 {
        border-color: #ffc62e;
      }
      .gift-all button.t3 {
        border-color: #ff6b5e;
      }
      .gift-all button.t4 {
        border-color: #c084fc;
      }
      .gift-all button.t5 {
        border-color: #2dd4bf;
      }
      .gift-all button.t6 {
        border-color: #f472b6;
      }
      .gift-all i {
        font-style: normal;
        font-size: 30px;
        line-height: 1;
      }
      .gift-all span {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .gift-all small {
        opacity: 0.7;
      }
      #giftGrid .gift i {
        font-size: 26px;
      }
      /* Lo que da cada regalo (ver boostOffer en main.js); la vida, con una cruz verde */
      .heal {
        width: 0.95em;
        height: 0.95em;
        margin-right: 0.1em;
        vertical-align: -0.12em;
        fill: #22c55e;
        stroke: #fff;
        stroke-width: 3.5;
        stroke-linejoin: round;
        paint-order: stroke;
      }
      .perks {
        font-style: normal;
        line-height: 1.1;
        letter-spacing: 0.05em;
        text-align: center;
      }

      /* Cuadro tipo chat bajo la arena que explica qué da cada regalo: los mensajes suben de uno en uno (ver
         setupGiftPanel en main.js); se mueve y cambia de tamaño con la tecla E */
      #ttBanner {
        display: none;
      }
      body.tiktok:not(.tt-controls) #ttBanner {
        position: absolute;
        top: 86cqw;
        left: 3.5cqw;
        z-index: 2;
        display: block;
        width: 93cqw;
        height: 24cqw;
        padding: 0 2.5cqw;
        background: var(--paper);
        border-radius: 1cqw;
        box-shadow: var(--box);
        font-family: Handwritten, system-ui, sans-serif;
        font-size: 3.3cqw;
        line-height: 1.25;
        color: #b06b4f;
        pointer-events: none;
      }
      #ttBanner .tt-window {
        height: 100%;
        overflow: hidden;
      }
      #ttBanner .tt-track {
        position: relative;
        transition: transform 0.6s ease;
      }
      /* Los mensajes que ya no caben enteros arriba se desvanecen del todo; con .jump, todo al momento */
      #ttBanner .tt-track p {
        transition: opacity 0.5s ease;
      }
      #ttBanner .tt-track p.gone {
        opacity: 0;
      }
      #ttBanner .tt-track.jump,
      #ttBanner .tt-track.jump p {
        transition: none;
      }
      #ttBanner p {
        display: flex;
        align-items: center;
        gap: 2cqw;
        margin: 0;
        padding: 1.4cqw 0;
        border-bottom: 0.3cqw dashed #dec37f;
      }
      #ttBanner p > i {
        flex: none;
        font-style: normal;
        font-size: 6.5cqw;
        line-height: 1;
      }
      #ttBanner b {
        font-weight: normal;
        color: #733d2c;
      }
      body.tt-edit #ttBanner,
      body.tt-edit #ttHowTo {
        z-index: 15;
        outline: 0.5cqw dashed #fe2c55;
        outline-offset: 1.4cqw;
        cursor: move;
        pointer-events: auto !important;
        touch-action: none;
        user-select: none;
      }
      body.tt-edit #ttBanner::after,
      body.tt-edit #ttHowTo::after {
        content: '';
        position: absolute;
        right: -1.4cqw;
        bottom: -1.4cqw;
        width: 5cqw;
        height: 5cqw;
        background: #fe2c55;
        border-radius: 1cqw;
        cursor: nwse-resize;
      }

      /* ¿Cómo jugar? Cómo se entra a pelear (ver setupGiftPanel en main.js), con la misma caja y letras que el ranking.
         De fábrica, abajo a la derecha, bajo el ranking; se mueve con la tecla E */
      #ttHowTo {
        display: none;
      }
      body.tiktok:not(.tt-controls) #ttHowTo {
        position: absolute;
        right: 5.1cqw;
        bottom: 3.5cqw;
        z-index: 2;
        display: block;
        width: 44cqw;
        padding: 1.2cqw 2.2cqw;
        background: var(--paper);
        border-radius: 1cqw;
        box-shadow: var(--box);
        font-family: Handwritten, system-ui, sans-serif;
        font-size: 2.9cqw;
        line-height: 1.25;
        color: #b06b4f;
        pointer-events: none;
      }
      #ttHowTo .tt-title {
        margin-bottom: 0.4cqw;
        font-family: LaBrute, GameFont, system-ui, sans-serif;
        font-size: 3.6cqw;
        letter-spacing: 0.2cqw;
        color: #733d2c;
      }
      #ttHowTo ul {
        display: flex;
        flex-direction: column;
        gap: 0.2cqw;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #ttHowTo li {
        display: flex;
        align-items: center;
        gap: 1.4cqw;
        white-space: nowrap;
      }
      #ttHowTo li i {
        width: 4cqw;
        font-style: normal;
        font-size: 3.4cqw;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>⚔️ LA BRUTE · DEMO</h1>

    <div class="panel" id="setup">
      <label for="royaleCount">Modo TikTok: <b id="royaleCountValue">6</b> brutes por ronda, todos contra todos</label>
      <input type="range" id="royaleCount" min="3" max="20" step="1" value="6" class="range" />
      <button
        id="tiktokGo"
        class="tiktok-btn"
        title="Pantalla vertical para transmitir en TikTok LIVE (tecla C: botones)"
      >
        📱 Modo TikTok (vertical)
      </button>
      <div class="divider"><span>nuevo</span></div>
      <button id="trailerGo" class="trailer-btn">🎬 Ver / Grabar Video Promocional</button>
    </div>

    <div class="panel" id="arena">
      <div id="ttHeader"><span>⚔️ BATTLE ROYALE</span><span id="ttRound"></span></div>
      <div id="status"></div>
      <div class="stage">
        <div class="shop roster-panel" id="roster"></div>
        <div id="canvas"></div>
      </div>
      <div id="ttRanking"></div>
      <div id="ttMascot"><img src="/images/mascota.png" alt="" draggable="false" /></div>
      <div id="ttMascot2" class="tt-img"><img src="/images/mascota2.png" alt="" draggable="false" /></div>
      <div id="ttChat"><span>Chat</span></div>
      <div id="ttBanner">
        <div class="tt-window"><div class="tt-track" id="ttBannerTrack"></div></div>
      </div>
      <div id="ttHowTo"></div>
      <div id="ttWinner"></div>
      <div class="controls">
        <button id="pause" title="Pausa" aria-label="Pausa">⏸️</button>
        <button id="speed" title="Velocidad">x1</button>
        <button id="sfx" title="Efectos de sonido" aria-label="Efectos de sonido" aria-pressed="true">🔊</button>
        <button id="music" title="Música" aria-label="Música" aria-pressed="true">🎵</button>
        <button id="again" title="Nueva ronda" aria-label="Nueva ronda">👑</button>
        <label class="icon-toggle" id="autoToggle" title="Rondas continuas: al terminar una ronda empieza otra sola"
          ><input type="checkbox" id="auto" aria-label="Rondas continuas" /><span>🔁</span></label
        >
        <label
          class="icon-toggle"
          id="zoomToggle"
          title="Zoom dinámico: acerca la cámara cuando quedan pocos en pie y la aleja cuando hay muchos"
          ><input type="checkbox" id="zoom" checked aria-label="Zoom dinámico" /><span>🔍</span></label
        >
        <button
          id="downloadPromo"
          class="download-btn"
          title="Descargar el video"
          aria-label="Descargar el video"
          hidden
        >
          ⬇️
        </button>
        <button id="gifts" title="Panel de regalos (tecla G)" aria-label="Panel de regalos">🎁</button>
        <button id="ttReset" title="Borrar el ranking" aria-label="Borrar el ranking">🗑️</button>
        <button id="back" title="Volver al menú" aria-label="Volver al menú">🏠</button>
      </div>
    </div>

    <!-- Panel de regalos: simula los regalos del directo (ver main.js) -->
    <div id="giftPanel">
      <div class="gift-head">
        <b>🎁 Regalos</b><span>simulador del directo</span
        ><button id="giftClose" title="Cerrar (tecla G)" aria-label="Cerrar">✕</button>
      </div>
      <div class="gift-live" id="giftLive" aria-live="polite"></div>
      <label
        class="gift-check"
        title="Quien entra a ver el directo entra a pelear aunque no comente, y en cada ronda nueva vuelven a pelear los que pasaron por el directo en los últimos 10 minutos (con poca gente llena la arena; con mucha, mejor desmarcarlo)"
        ><input id="giftMembers" type="checkbox" checked /> 🚪 Quien entra al directo, a pelear</label
      >
      <label for="giftUser">Espectador</label>
      <div class="gift-user">
        <input id="giftUser" placeholder="nombre de TikTok (vacío: al azar)" maxlength="24" autocomplete="off" />
        <button id="giftRandom" title="Nombre al azar" aria-label="Nombre al azar">🎲</button>
      </div>
      <div class="gift-actions">
        <button id="giftJoin" title="Entra a la pelea sin regalo (como quien comenta para unirse)">🙋 Unirse</button>
        <button id="giftTap" title="Toques en la pantalla: 20 por la cantidad elegida (x5: 100, lo que da +30 de vida)">
          👆 Tap tap
        </button>
        <button id="giftPopup" title="Abrir el panel en otra ventana: así en el directo se captura solo el juego">
          ↗️ Otra ventana
        </button>
      </div>
      <div class="gift-count" id="giftCount">
        <span>Cantidad</span><button data-count="1" class="on">x1</button><button data-count="5">x5</button
        ><button data-count="10">x10</button>
      </div>
      <div class="gift-grid" id="giftGrid"></div>
      <div class="gift-round">
        <b>Todos los regalos</b>
        <input id="giftSearch" type="search" placeholder="Buscar regalo (Rose, Lion, Galaxy…)" autocomplete="off" />
        <div class="gift-all" id="giftAll"></div>
      </div>
      <div class="gift-round">
        <b>Ronda</b>
        <div class="gift-round-row">
          <label class="tt-timer" title="Duración del reloj de la ronda (minutos : segundos)"
            >⏱ <input id="ttTimerMin" type="number" min="0" max="99" value="3" aria-label="Minutos" />:<input
              id="ttTimerSec"
              type="number"
              min="0"
              max="59"
              value="0"
              aria-label="Segundos"
          /></label>
          <button
            id="ttTimerBtn"
            title="Activa o para el reloj de la ronda: al llegar a cero gana quien más victorias lleve"
          >
            ▶️ Iniciar reloj
          </button>
        </div>
        <div class="gift-round-row">
          <label class="gift-check" title="Al terminar una ronda empieza otra sola"
            ><input id="giftAuto" type="checkbox" /> 🔁 Rondas continuas</label
          >
          <button id="giftNewRound" title="Empieza una ronda nueva ahora">👑 Nueva ronda</button>
        </div>
        <div class="gift-round-row">
          <button id="giftClearRank" title="Borra el ranking de muertes guardado">🗑️ Limpiar ranking</button>
        </div>
      </div>
      <div class="gift-round">
        <b>Sonido y rendimiento</b>
        <div class="gift-round-row">
          <button id="giftMusic" title="Música de fondo">🎵 Música</button>
          <select id="giftTrack" aria-label="Pista de música" title="Pista de música">
            <option value="background">Pelea</option>
            <option value="menu">Menú</option>
          </select>
          <input id="giftMusicVol" type="range" min="0" max="100" value="60" aria-label="Volumen de la música" />
        </div>
        <div class="gift-round-row">
          <button id="giftSfx" title="Efectos de sonido y voces">🔊 Efectos</button>
          <input id="giftSfxVol" type="range" min="0" max="100" value="100" aria-label="Volumen de los efectos" />
        </div>
        <div class="gift-round-row gift-fps-row">
          <span>Fotogramas por segundo</span
          ><b id="giftFps" title="Con ⚡ la calidad automática está bajando el detalle">-- fps</b>
        </div>
      </div>
      <div class="gift-round">
        <b>Fondo de la arena</b>
        <div class="gift-round-row">
          <select id="giftBg" aria-label="Fondo de la arena"></select>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
